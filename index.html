<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أذكار المسلم</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script defer src="main.js"></script>
</head>

<body>
  <div class="app-container">
    <header>
      <h1>أذكار المسلم</h1>
      <p id="date-display"></p>
    </header>

    <main id="main-content">
      <!-- Views will be injected here -->
    </main>

    <nav id="bottom-nav">
      <button id="nav-home" class="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        الرئيسية
      </button>
      <button id="nav-settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        الإعدادات
      </button>
    </nav>
  </div>

  <!-- Templates -->
  <template id="category-card-template">
    <div class="category-card">
      <h3 class="category-title"></h3>
      <div class="category-meta">
        <span class="category-count"></span>
        <span class="category-progress">0%</span>
      </div>
    </div>
  </template>

  <template id="zkr-card-template">
    <div class="zkr-card">
      <p class="zkr-text"></p>
      <p class="zkr-description"></p>
      <div class="zkr-footer">
        <span class="zkr-current-count">0</span>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <div class="zkr-target-wrapper">
          <span class="zkr-target-count"></span>
          <button class="edit-goal-btn" style="display: none;" title="تعديل الهدف">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Inline Goal Editor Panel -->
      <div class="goal-editor" style="display: none;">
        <div class="goal-editor-header">
          <span>تعديل الهدف:</span>
        </div>
        <div class="goal-editor-body">
          <div class="preset-buttons">
            <button class="preset-btn" data-value="33">33</button>
            <button class="preset-btn" data-value="100">100</button>
            <button class="preset-btn" data-value="1000">1000</button>
          </div>
          <div class="custom-input-group">
            <input type="number" class="custom-goal-input" min="1" max="99999" placeholder="هدف مخصص" />
            <button class="save-goal-action-btn">حفظ</button>
            <button class="cancel-goal-action-btn">إلغاء</button>
          </div>
        </div>
      </div>

      <button class="zkr-action-area"></button>
    </div>
  </template>

</body>

</html>
